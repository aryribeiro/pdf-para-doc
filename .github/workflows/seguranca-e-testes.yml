name: Segurança e testes

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 9 * * 1"   # toda segunda: CVE nova aparece sem ninguém mexer no código
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  seguranca:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Ferramentas
        run: pip install pip-audit bandit
      - name: Dependências com vulnerabilidade conhecida (pip-audit)
        run: pip-audit -r requirements.txt --strict
      - name: Análise do código (Bandit)
        run: bandit -r aplicativo.py conversor.py

  testes:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Bancada no espelho do Streamlit Cloud (Debian + Tesseract + 1 GB)
        run: |
          docker build -f tests/Dockerfile.smoke -t pdf-doc-smoke .
          docker run --rm --memory=1g --memory-swap=1g pdf-doc-smoke
